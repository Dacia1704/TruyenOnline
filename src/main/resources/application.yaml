server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: truyenonline

  datasource:
    url: jdbc:mysql://localhost:3306/truyenonline?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 123456 # Nên truyền qua biến môi trường
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Tắt tính năng tự động tạo bảng của Hibernate vì đã dùng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

jwt:
